stages:
  - test
  - build

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

backend-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -m pip install -U pip
    - pip install -r requirements.txt
  script:
    - pytest -q

frontend-build:
  stage: build
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
